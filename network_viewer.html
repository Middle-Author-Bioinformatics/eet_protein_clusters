<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{color-scheme:light;font:14px system-ui;color:#213e45;background:#f4f7f7}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{padding:20px 24px;background:white;border-bottom:1px solid #d4e1e1}h1{font-size:22px;margin:0 0 9px}p{margin:7px 0;line-height:1.45}.muted{color:#61777e;font-size:12px}a{color:#006f76}button,input,select{font:inherit;padding:7px;border:1px solid #adc5c8;border-radius:4px;background:white;color:#23464b}button{cursor:pointer}button:hover{background:#dceeee}label{display:inline-flex;gap:5px;align-items:center}#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:#eaf1f1}#search{min-width:230px}input[type=range]{width:130px;padding:0}main{display:grid;grid-template-columns:minmax(300px,1fr) 340px;height:calc(100vh - 245px);min-height:450px}#plot{position:relative;overflow:hidden;background:white}canvas{width:100%;height:100%;display:block;touch-action:none}#hover{position:absolute;pointer-events:none;display:none;max-width:360px;background:#16353eee;color:white;padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap}#status{padding:8px 24px;font-size:12px;background:#dceaea}aside{overflow:auto;padding:14px;background:#f7fafa;border-left:1px solid #d4e1e1}h2{font-size:16px;margin:10px 0}dl{margin:0;font-size:12px}dt{font-weight:600;margin-top:6px}dd{margin:0;overflow-wrap:anywhere}#node-list{display:flex;flex-direction:column;gap:5px}#node-list button{text-align:left;font-size:12px;overflow-wrap:anywhere}#neighbors{font-size:12px}#legend{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px;font-size:11px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}#empty{position:absolute;left:25px;top:25px;color:#607980}#selected{padding-bottom:15px;border-bottom:1px solid #d5e3e4}#pair{width:55px}#protein-members{font-size:12px;padding-bottom:14px;border-bottom:1px solid #d5e3e4}#member-list{list-style:none;max-height:420px;overflow:auto;padding:0}#member-list li{padding:10px 0;border-bottom:1px solid #dce6e7;overflow-wrap:anywhere}#member-search{min-width:0;flex:1;width:100%;margin:0}.member-actions{display:flex;gap:6px;margin:10px 0}.member-actions button{font-size:12px;white-space:nowrap}.connection{display:flex;gap:6px;align-items:center;margin:6px 0}.neighbor-target{flex:1;min-width:0;text-align:left;font-size:12px}.shared-proteins{white-space:nowrap;font-size:12px}.selection-name{font-size:16px;font-weight:650;overflow-wrap:anywhere}.selection-annotation{font-size:13px;overflow-wrap:anywhere}.member-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.member-id{margin:3px 0;font-size:11px}summary{cursor:pointer;color:#37656b;font-size:12px;padding:7px 0}#technical-details,#browse-nodes,#legend-details{margin:6px 0}#statistics{font-size:12px;overflow-wrap:anywhere}#member-context:empty{display:none}#member-list details{font-size:11px}#member-list summary{padding:2px 0}#member-status{font-weight:600}.cluster-badge{display:inline-block;font-size:11px;color:#315c66;background:#e2edef;border:1px solid #c8dcdf;border-radius:4px;padding:2px 6px;margin:3px 0}.cluster-badge.active-cluster{color:#814500;background:#fff0dc;border-color:#dc9a42}.cluster-badge.unknown-cluster{color:#65757a;background:#edf1f2}#cluster-status{padding:7px 24px;background:#fff3e2;color:#77450b;font-size:12px}.cluster-domain-match{border-color:#cf7b1b!important;background:#fff1dc!important}.cluster-domain-other{opacity:.4}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#plot{height:65vh}aside{max-height:45vh}header,#controls{padding:12px}h1{font-size:19px}}
</style></head><body>
<header><h1>@@TITLE@@</h1><p>@@DEFINITION@@</p><p class="muted" id="scope"></p><nav>@@DOWNLOADS@@</nav></header>
<div id="controls"><input id="search" type="search" aria-label="Search nodes" placeholder="Find protein, domain name or accession"><select id="group" aria-label="Cluster or community"><option value="">All groups</option></select><label id="protein-cluster-control">Highlight cluster <select id="protein-cluster" aria-label="Highlight protein cluster"><option value="">None</option></select></label><label><input id="include-neighbors" type="checkbox" checked>Include neighbors</label><label><span id="threshold-label">Minimum identity</span><input id="threshold" type="range" min="0" max="100" value="0"><output id="threshold-value">0</output></label><label id="pair-label">Shared proteins <input id="pair" type="number" min="1" value="1"></label><label><input id="labels" type="checkbox" checked>Labels</label><label><input id="hide-isolated" type="checkbox">Hide isolated</label><button id="fit">Fit</button><button id="reset">Reset</button><button id="relax">Relax layout</button><button id="download-data">Visible data</button><button id="download-table">Node TSV</button><button id="download-image">PNG</button></div>
<div id="cluster-status" role="status" hidden></div><div id="status" role="status"></div><main><section id="plot"><canvas id="network" aria-label="Interactive network canvas"></canvas><div id="hover"></div><div id="empty" hidden>No nodes match these filters.</div></section><aside><section id="selected"><h2>Selection</h2><div id="details"></div><details id="technical-details" hidden><summary>More details</summary><div id="statistics"></div></details><div id="neighbors"></div></section><section id="protein-members" hidden><h2 id="member-title">Proteins</h2><p id="member-context" class="muted"></p><p id="member-status"></p><details id="member-notes" hidden><summary>About this list</summary><p id="member-note"></p></details><div class="member-actions"><input id="member-search" type="search" aria-label="Search carrier proteins" placeholder="Search names or IDs"><button id="download-members">Download TSV</button></div><p id="member-list-status" class="muted" hidden></p><ul id="member-list"></ul></section><details id="browse-nodes"><summary>Browse nodes</summary><p id="list-status" class="muted"></p><div id="node-list"></div></details><details id="legend-details"><summary>Groups</summary><div id="legend"></div></details></aside></main>
<script id="network-data" type="application/json">@@DATA@@</script><script>@@SCRIPT@@</script></body></html>
