<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{color-scheme:light;font:14px system-ui;color:#213e45;background:#f4f7f7}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:white;border-bottom:1px solid #d4e1e1}h1{font-size:22px;margin:0 0 9px}p{margin:7px 0;line-height:1.45}.muted{color:#61777e;font-size:12px}a{color:#006f76}button,input,select{font:inherit;padding:7px;border:1px solid #adc5c8;border-radius:4px;background:white;color:#23464b}button{cursor:pointer}button:hover{background:#dceeee}label{display:inline-flex;gap:5px;align-items:center}#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:#eaf1f1}#search{min-width:230px}input[type=range]{width:130px;padding:0}main{display:grid;grid-template-columns:minmax(300px,1fr) 340px;height:calc(100vh - 245px);min-height:450px}#plot{position:relative;overflow:hidden;background:white}canvas{width:100%;height:100%;display:block;touch-action:none}#hover{position:absolute;pointer-events:none;display:none;max-width:360px;background:#16353eee;color:white;padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap}#status{padding:8px 24px;font-size:12px;background:#dceaea}aside{overflow:auto;padding:14px;background:#f7fafa;border-left:1px solid #d4e1e1}h2{font-size:16px;margin:10px 0}dl{margin:0;font-size:12px}dt{font-weight:600;margin-top:6px}dd{margin:0;overflow-wrap:anywhere}#node-list{display:flex;flex-direction:column;gap:5px}#node-list button{text-align:left;font-size:12px;overflow-wrap:anywhere}#neighbors{font-size:12px}#legend{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px;font-size:11px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}#empty{position:absolute;left:25px;top:25px;color:#607980}#selected{padding-bottom:15px;border-bottom:1px solid #d5e3e4}#pair{width:55px}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}#plot{height:65vh}aside{max-height:45vh}header,#controls{padding:12px}h1{font-size:19px}}
</style></head><body>
<header><h1>@@TITLE@@</h1><p>@@DEFINITION@@</p><p class="muted" id="scope"></p><nav>@@DOWNLOADS@@</nav></header>
<div id="controls"><input id="search" type="search" aria-label="Search nodes" placeholder="Find protein, domain name or accession"><select id="group" aria-label="Cluster or community"><option value="">All groups</option></select><label><input id="include-neighbors" type="checkbox" checked>Include neighbors</label><label><span id="threshold-label">Minimum identity</span><input id="threshold" type="range" min="0" max="100" value="0"><output id="threshold-value">0</output></label><label id="pair-label">Shared proteins <input id="pair" type="number" min="1" value="1"></label><label><input id="labels" type="checkbox" checked>Labels</label><label><input id="hide-isolated" type="checkbox">Hide isolated</label><button id="fit">Fit</button><button id="reset">Reset</button><button id="relax">Relax layout</button><button id="download-data">Visible data</button><button id="download-image">PNG</button></div>
<div id="status" role="status"></div><main><section id="plot"><canvas id="network" aria-label="Interactive network canvas"></canvas><div id="hover"></div><div id="empty" hidden>No nodes match these filters.</div></section><aside><div id="legend"></div><section id="selected"><h2>Selected node</h2><dl id="details"></dl><div id="neighbors"></div></section><h2>Visible nodes</h2><p id="list-status" class="muted"></p><div id="node-list"></div></aside></main>
<script id="network-data" type="application/json">@@DATA@@</script><script>@@SCRIPT@@</script></body></html>
