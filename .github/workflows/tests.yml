name: Protein domain profiles
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y mcl diamond-aligner
      - run: python -m pip install -r requirements-genomes.txt pytest
      - run: python -m pytest -q
      - run: python cluster_domains.py --help
      - run: python genome_pipeline.py --help
