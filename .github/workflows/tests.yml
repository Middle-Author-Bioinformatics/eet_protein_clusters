name: Protein domain profiles
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EET_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      REQUIRE_BROWSER_TESTS: 1
      NETWORK_TEST_ARTIFACTS: test-artifacts
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y mcl diamond-aligner mafft fasttree
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python cluster_domains.py --help
      - run: python genome_pipeline.py --help
      - run: python network_reports.py --help
      - run: python annotate_clusters_nr.py --help
      - run: python -S summarize_clusters_llm.py --help
      - run: python -S download_cdd.py --help
      - run: python cluster_cdd.py --help
      - run: python protein_pipeline.py --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-preview-${{ matrix.python }}
          path: test-artifacts/
          if-no-files-found: ignore
